<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IoT Quiz Bench</title>
<style>
:root{--bg:#ffffff;--soft:#f1f6ff;--fg:#14213d;--muted:#5f6f8a;--line:#d7e3f8;--accent:#2563eb;--accent-fg:#ffffff;
--good:#15803d;--good-soft:#e3f8ea;--bad:#dc2626;--bad-soft:#fde8e8;color-scheme:light;
--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5;
padding-block:32px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:620px;margin:0 auto}
h1{font-size:26px;margin:0 0 24px;font-weight:700;color:var(--accent)}
h2{font-size:13px;margin:26px 0 10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
button{font:inherit;color:inherit;cursor:pointer;background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:8px 14px}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg button{padding:16px;font-size:18px;font-weight:600;text-align:center;background:var(--soft)}
.seg button[aria-pressed="true"],.chip[aria-pressed="true"],.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.desc{margin:10px 0 0;color:var(--muted);font-size:14px}
.primary{padding:12px 22px;font-weight:600;margin-top:28px}
.primary.inline{margin-top:0}
.primary[disabled]{opacity:.4;cursor:not-allowed}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px;margin-bottom:8px;gap:12px}
.top button{border:0;padding:4px 0;color:var(--muted);background:none}
.top span{text-align:right}
.track{height:6px;background:var(--soft);border-radius:3px;margin-bottom:28px;overflow:hidden}
.fill{height:100%;background:var(--accent);transition:width .2s}
.qtext{font-size:19px;line-height:1.45;margin:0 0 20px;font-weight:500}
.sub{color:var(--muted);font-size:14px;margin:-12px 0 16px}
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.opt{display:flex;gap:10px;text-align:left;width:100%;padding:12px 14px;min-width:0;background:var(--soft)}
.opt .k{flex:none;color:var(--accent);font-weight:600;width:1.2em}
.opt .t{min-width:0;overflow-wrap:anywhere}
.opt[aria-pressed="true"]{border-color:var(--accent);background:#dbe8ff}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.missed{border-color:var(--good);border-style:dashed}
.opt[disabled]{cursor:default}
.fb{margin:0 0 20px;font-size:15px}
.fb b{display:block}
.fb.ok b{color:var(--good)}.fb.bad b{color:var(--bad)}
.fb span{color:var(--muted)}
.score{font-size:52px;font-weight:700;margin:8px 0 20px;color:var(--accent)}
.miss{border-top:1.5px solid var(--line);padding:14px 0;font-size:15px}
.miss p{margin:0 0 4px}
.miss .q{font-weight:600}
.miss .a{color:var(--muted)}
.miss .a b{color:var(--good)}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
html{-webkit-text-size-adjust:100%}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-height:44px}
.top button{min-height:0}
.chip{min-height:44px}
@media (max-width:480px){
body{padding-block:20px 36px}
h1{font-size:22px;margin-bottom:18px}
.qtext{font-size:18px}
.opt{padding:14px}
.primary{width:100%}
.primary.inline{width:100%;margin-top:4px}
.row{gap:8px}
.top{font-size:13px}
.score{font-size:44px}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

-grid voltage phasors", "Water-level values"], "a", ""]]
};

var ALL = [];
Object.keys(BANK).forEach(function(w){
  BANK[w].forEach(function(r,i){
    ALL.push({id:w+"-"+(i+1), w:+w, n:i+1, q:r[0], o:r[1], a:r[2], e:r[3]});
  });
});

var app = document.getElementById("app");
var S = null;
var cfg = {mode:"assignment", scope:"all", shuffle:false};
var LET = "abcd";
var NW = Object.keys(BANK).length;

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function shuffle(a){
  a = a.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function pool(c){ return c.scope==="all" ? ALL : ALL.filter(function(x){ return x.w===+c.scope; }); }
function modeName(m){ return m==="quiz" ? "Quiz" : "Assignment"; }

function renderHome(){
  S = null;
  var n = pool(cfg).length;
  var scopes = ['<button class="chip" data-scope="all" aria-pressed="'+(cfg.scope==="all")+'">All weeks</button>'];
  for(var w=1; w<=NW; w++) scopes.push('<button class="chip" data-scope="'+w+'" aria-pressed="'+(String(cfg.scope)===String(w))+'">Week '+w+'</button>');
  app.innerHTML =
    '<h1>IoT Quiz</h1>' +
    '<h2>Questions from</h2><div class="row">'+scopes.join("")+'</div>' +
    '<h2>Order</h2><div class="row">' +
      '<button class="chip" data-shuffle="0" aria-pressed="'+(!cfg.shuffle)+'">In order</button>' +
      '<button class="chip" data-shuffle="1" aria-pressed="'+cfg.shuffle+'">Shuffled</button></div>' +
    '<button class="primary" id="start">Start &middot; '+n+' questions</button>';
}

function begin(c, list, label, retry){
  S = {cfg:{mode:c.mode, scope:c.scope, shuffle:c.shuffle}, mode:c.mode, retry:!!retry, list:list, label:label, i:0, sel:[], revealed:false, results:[]};
  renderQuestion();
}
function startFromCfg(c){
  var list = pool(c).slice();
  if(c.shuffle) list = shuffle(list);
  begin(c, list, (c.scope==="all" ? "All weeks" : "Week "+c.scope));
}

function isCorrect(item, sel){ return sel.slice().sort().join("") === item.a; }

function renderQuestion(){
  var it = S.list[S.i], multi = it.a.length > 1, total = S.list.length, fbMode = S.mode === "assignment";
  var pct = Math.round((S.i + (S.revealed?1:0)) / total * 100);
  var opts = it.o.map(function(t,k){
    var L = LET[k], cls = "opt", pressed = S.sel.indexOf(L) > -1;
    if(S.revealed){
      var right = it.a.indexOf(L) > -1;
      if(right && pressed) cls += " ok"; else if(right) cls += " missed"; else if(pressed) cls += " bad";
    }
    return '<button class="'+cls+'" data-k="'+L+'" aria-pressed="'+pressed+'"'+(S.revealed?' disabled':'')+'><span class="k">'+L.toUpperCase()+'</span><span class="t">'+esc(t)+'</span></button>';
  }).join("");
  var fb = "", action;
  if(S.revealed){
    var ok = isCorrect(it, S.sel);
    var ans = it.a.split("").map(function(l){ return l.toUpperCase(); }).join(", ");
    fb = '<p class="fb '+(ok?'ok':'bad')+'"><b>'+(ok?'Correct':'Wrong. Answer: '+ans)+'</b>'+(it.e?'<span>'+esc(it.e)+'</span>':'')+'</p>';
    action = '<button class="primary inline" id="next">'+(S.i+1<total?'Next':'Results')+'</button>';
  } else if(fbMode){
    action = '<button class="primary inline" id="check"'+(S.sel.length?'':' disabled')+'>Check</button>';
  } else {
    action = '<button class="primary inline" id="check"'+(S.sel.length?'':' disabled')+'>'+(S.i+1<total?'Next':'Finish')+'</button>';
  }
  app.innerHTML =
    '<div class="top"><button id="quit">&larr; Exit</button><span>'+esc(S.label)+' &middot; '+(S.i+1)+'/'+total+'</span></div>' +
    '<div class="track"><div class="fill" style="width:'+pct+'%"></div></div>' +
    '<p class="qtext">'+esc(it.q)+'</p>' + (multi?'<p class="sub">Select all that apply</p>':'') +
    '<div class="opts">'+opts+'</div>' + fb + action;
}

function pick(L){
  if(!S || S.revealed) return;
  var it = S.list[S.i];
  if(it.a.length > 1){
    var p = S.sel.indexOf(L);
    if(p > -1) S.sel.splice(p,1); else S.sel.push(L);
  } else { S.sel = [L]; }
  renderQuestion();
}
function check(){
  if(!S || S.revealed || !S.sel.length) return;
  var it = S.list[S.i];
  S.results.push({item:it, sel:S.sel.slice(), ok:isCorrect(it, S.sel)});
  if(S.mode === "assignment"){ S.revealed = true; renderQuestion(); }
  else advance();
}
function advance(){
  if(S.i + 1 < S.list.length){ S.i++; S.sel = []; S.revealed = false; renderQuestion(); }
  else renderResults();
}
function next(){ if(S && S.revealed) advance(); }

function renderResults(){
  var score = S.results.filter(function(r){ return r.ok; }).length, total = S.results.length;
  var missed = S.results.filter(function(r){ return !r.ok; });
  var list = missed.map(function(r){
    var it = r.item;
    var right = it.a.split("").map(function(l){ return l.toUpperCase()+". "+it.o[LET.indexOf(l)]; }).join(" | ");
    var yours = r.sel.map(function(l){ return l.toUpperCase()+". "+it.o[LET.indexOf(l)]; }).join(" | ");
    return '<div class="miss"><p class="q">'+esc(it.q)+'</p><p class="a">You chose: '+esc(yours)+'</p><p class="a">Answer: <b>'+esc(right)+'</b></p>'+(it.e?'<p class="a">'+esc(it.e)+'</p>':'')+'</div>';
  }).join("");
  app.innerHTML =
    '<div class="top"><button id="quit">&larr; Home</button><span>'+esc(S.label)+'</span></div>' +
    '<div class="score">'+score+' / '+total+'</div>' +
    '<div class="row">' +
      (missed.length ? '<button class="primary inline" id="retryMissed">Retry missed ('+missed.length+')</button>' : '') +
      '<button id="again">'+(S.retry?'Home':'Restart')+'</button></div>' +
    (missed.length ? '<h2>Missed</h2>'+list : '');
}

app.addEventListener("click", function(e){
  var t = e.target.closest("button"); if(!t) return;
  if(t.dataset.scope){ cfg.scope = t.dataset.scope; return renderHome(); }
  if(t.dataset.shuffle){ cfg.shuffle = t.dataset.shuffle === "1"; return renderHome(); }
  if(t.id === "start") return startFromCfg(cfg);
  if(t.dataset.k) return pick(t.dataset.k);
  if(t.id === "check") return check();
  if(t.id === "next") return next();
  if(t.id === "quit") return renderHome();
  if(t.id === "retryMissed"){
    var m = S.results.filter(function(r){ return !r.ok; }).map(function(r){ return r.item; });
    return begin(S.cfg, shuffle(m), "Retry", true);
  }
  if(t.id === "again"){ return S.retry ? renderHome() : startFromCfg(S.cfg); }
});
document.addEventListener("keydown", function(e){
  if(!S || e.metaKey || e.ctrlKey || e.altKey || !document.querySelector(".opts")) return;
  var k = e.key.toLowerCase();
  if(!S.revealed && k.length === 1 && "abcd".indexOf(k) > -1){
    if(LET.indexOf(k) < S.list[S.i].o.length) pick(k);
  } else if(e.key === "Enter"){
    e.preventDefault();
    if(S.revealed) next(); else check();
  }
});
renderHome();
</script>
