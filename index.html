<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IoT Quiz Bench</title>
<style>
:root{--bg:#ffffff;--soft:#f1f6ff;--fg:#14213d;--muted:#5f6f8a;--line:#d7e3f8;--accent:#2563eb;--accent-fg:#ffffff;
--good:#15803d;--good-soft:#e3f8ea;--bad:#dc2626;--bad-soft:#fde8e8;color-scheme:light;
--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5;
padding-block:32px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:620px;margin:0 auto}
h1{font-size:26px;margin:0 0 24px;font-weight:700;color:var(--accent)}
h2{font-size:13px;margin:26px 0 10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
button{font:inherit;color:inherit;cursor:pointer;background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:8px 14px}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg button{padding:16px;font-size:18px;font-weight:600;text-align:center;background:var(--soft)}
.seg button[aria-pressed="true"],.chip[aria-pressed="true"],.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.desc{margin:10px 0 0;color:var(--muted);font-size:14px}
.primary{padding:12px 22px;font-weight:600;margin-top:28px}
.primary.inline{margin-top:0}
.primary[disabled]{opacity:.4;cursor:not-allowed}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px;margin-bottom:8px;gap:12px}
.top button{border:0;padding:4px 0;color:var(--muted);background:none}
.top span{text-align:right}
.track{height:6px;background:var(--soft);border-radius:3px;margin-bottom:28px;overflow:hidden}
.fill{height:100%;background:var(--accent);transition:width .2s}
.qtext{font-size:19px;line-height:1.45;margin:0 0 20px;font-weight:500}
.sub{color:var(--muted);font-size:14px;margin:-12px 0 16px}
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.opt{display:flex;gap:10px;text-align:left;width:100%;padding:12px 14px;min-width:0;background:var(--soft)}
.opt .k{flex:none;color:var(--accent);font-weight:600;width:1.2em}
.opt .t{min-width:0;overflow-wrap:anywhere}
.opt[aria-pressed="true"]{border-color:var(--accent);background:#dbe8ff}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.missed{border-color:var(--good);border-style:dashed}
.opt[disabled]{cursor:default}
.fb{margin:0 0 20px;font-size:15px}
.fb b{display:block}
.fb.ok b{color:var(--good)}.fb.bad b{color:var(--bad)}
.fb span{color:var(--muted)}
.score{font-size:52px;font-weight:700;margin:8px 0 20px;color:var(--accent)}
.miss{border-top:1.5px solid var(--line);padding:14px 0;font-size:15px}
.miss p{margin:0 0 4px}
.miss .q{font-weight:600}
.miss .a{color:var(--muted)}
.miss .a b{color:var(--good)}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
html{-webkit-text-size-adjust:100%}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-height:44px}
.top button{min-height:0}
.chip{min-height:44px}
@media (max-width:480px){
body{padding-block:20px 36px}
h1{font-size:22px;margin-bottom:18px}
.qtext{font-size:18px}
.opt{padding:14px}
.primary{width:100%}
.primary.inline{width:100%;margin-top:4px}
.row{gap:8px}
.top{font-size:13px}
.score{font-size:44px}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* Question bank: [question, options (a,b,c,d in order), answer letters, short explanation] */
var BANK = {
1:[
["According to the ITU Internet Report 2005 discussed in the lecture, the future Internet is expected to become wider and more complex mainly because:",["Humans will completely stop using the Internet","Most Internet traffic may flow between devices and different kinds of things","Only desktop computers will remain connected","Internet communication will be restricted to email services"],"b","Humans may become a minority as generators and receivers of traffic. Communication increasingly happens between devices and things, forming the IoT."],
["Which of the following are characteristics of IoT systems?",["Efficient and scalable architecture","Unambiguous naming and addressing","Presence of sleeping nodes, mobile nodes, and non-IP devices","Guaranteed continuous connectivity for every device at all times"],"abc","IoT needs scalable architecture, clear naming and addressing, and support for heterogeneous devices. Connectivity may be intermittent, so option d is wrong."],
["In the lecture, 'Smart Dust' refers to:",["A cloud storage model for IoT data","A large-scale wireless router used in smart cities","Very tiny computing devices that can be sprayed or injected for sensing purposes","A type of IPv6 address used in IoT networks"],"c","Smart Dust means extremely small computing devices, smaller than a grain of sand, used for example to measure chemicals in soil or diagnose problems in the body."],
["Which statement best explains the relation between IoT and M2M communication?",["IoT and M2M are exactly the same","M2M is broader than IoT because it includes people and applications","M2M is a part of IoT, while IoT has a broader scope of interactions","IoT does not include machine-to-machine interaction"],"c","M2M focuses on communication among machines. IoT is broader: it includes things, people, applications and systems."],
["State whether the following statement is True or False. In the Web of Things, IoT sensors are replaced completely by cloud databases.",["True","False"],"b","The Web of Things does not replace sensors. Sensors still collect physical-world data; web technologies expose and access IoT resources."],
["In an IoT network configuration, local addresses may be valid only within a gateway's domain, and the same local address may appear under another gateway. The main advantage is:",["It increases unnecessary address consumption","It helps conserve address space","It removes the requirement of a gateway","It prevents any device from communicating with the Internet"],"b","Locally valid addresses can be reused across gateway domains, which avoids wasting global addresses."],
["Which of the following functions are associated with IoT gateways in the addressing strategy discussed in the lecture?",["Providing Internet connectivity","Supporting IoT LAN intra-connectivity","Obtaining upstream address prefixes using mechanisms such as DHCPv6","Delegating addresses to nodes using SLAAC"],"abcd","Gateways provide Internet and LAN connectivity, obtain prefixes via DHCPv6 and delegate addresses to nodes using SLAAC."],
["Which of the following is true about IPv6 compared to IPv4?",["IPv6 uses dotted decimal notation","IPv6 has a smaller address space than IPv4","IPv6 uses hexadecimal notation and supports a much larger address space","IPv6 requires broadcast addresses in the same way as IPv4"],"c","IPv4 uses 32-bit dotted decimal addresses; IPv6 uses 128-bit hexadecimal addresses."],
["Which statement correctly represents the design expectation from a good sensor?",["It should influence the measured property significantly","It should respond strongly to unrelated physical properties","It should be sensitive to the measured property and should not disturb it","It should always produce random output"],"c","A good sensor measures the desired property, ignores unrelated ones and does not alter the measured quantity."],
["Which of the following statements about sensor resolution are correct?",["Sensor resolution is the smallest change that the sensor can detect","For a digital sensor, resolution is related to the smallest digital output change it can process","Sensor resolution and sensor accuracy always refer to exactly the same property","Sensor accuracy does not depend only on resolution"],"abd","Resolution is the smallest detectable change. Accuracy is different: a high-resolution sensor can still be inaccurate because of bias or calibration errors."],
["State True or False. An accelerometer that measures acceleration along the x, y, and z coordinate axes is classified as a vector sensor.",["True","False"],"a","A vector sensor measures quantities with magnitude and direction. An accelerometer measures components along different axes."],
["A sensor gives different output for the same input value depending on whether that input was reached by increasing or decreasing the measured quantity. This error is called:",["Quantization error","Hysteresis error","IPv6 translation error","Gateway prefix error"],"b","Hysteresis error means the output depends on the previous input history."],
["State True or False. A hydraulic actuator can produce considerable force because liquids are nearly incompressible.",["False","True"],"b","Hydraulic actuators use fluid to generate motion; since liquids are nearly incompressible they can exert large forces."],
["Which of the following statements are correct about Shape Memory Polymer actuators?",["They may respond to stimuli such as light, heat, electrical, magnetic, pH, or moisture changes","They can show high strain recovery","They may have properties such as low density and biocompatibility","They are used only as passive temperature sensors"],"abc","SMP actuators respond to varied stimuli and offer low density, high strain recovery and biocompatibility. They are actuator materials, not passive sensors."],
["State whether True or False. In the IoT implementation example, data gathered by a sensor travels through a gateway and a proxy server before arriving at the cloud server.",["True","False"],"a","The sensor collects data, which then passes through the gateway and proxy server before reaching the cloud server."]
],
2:[
["In MQTT, which field of a published message is used by the broker as routing information?",["Topic","Client identifier","Payload length","Session timer"],"a","The topic in a published message is the routing information the broker uses to deliver it to matching subscribers."],
["Which of the following statements about MQTT topic wildcards are correct?",["The plus sign (+) matches an arbitrary value at exactly one hierarchy level.","The hash sign (#) can be used to subscribe to all underlying hierarchy levels.","The subscription house/# matches only the exact topic house.","The subscription house/+/temperature can match house/kitchen/temperature."],"abd","+ is a single-level wildcard and # is multilevel. house/# matches all topics beginning with house, not only house itself."],
["Which of the following are main stages of Secure MQTT (SMQTT)?",["Setup","Publish","Decryption","Route discovery"],"abc","SMQTT has four stages: setup, encryption, publish and decryption. Route discovery is not one of them."],
["At the transport layer, CoAP (Constrained Application Protocol) operates over which protocol?",["TCP","UDP","SCTP","FTP"],"b","CoAP is designed for constrained environments and runs over UDP to reduce overhead."],
["State True or False. In CoAP, a piggyback response is carried with the acknowledgment, whereas in the separate mode the server response is sent in a message separate from the acknowledgment.",["True","False"],"a","Piggyback: the response rides in the ACK. Separate: the ACK comes first and the response follows later."],
["Which of the following CoAP request-method mappings are correct?",["GET - retrieve data","PUT - create data","PUSH - update data","DELETE - delete data"],"abcd","As presented in the lecture, GET, PUT, PUSH and DELETE retrieve, create, update and delete data respectively."],

["In a non-beacon-enabled IEEE 802.15.4 network, data frames are transmitted using:",["Slotted CSMA/CA","Unslotted CSMA/CA","Token passing","Pure TDMA only"],"b","Non-beacon-enabled networks use unslotted CSMA/CA. Beacon-enabled ones use slotted CSMA/CA with a superframe."],
["Which statement correctly describes the relationship between IEEE 802.15.4 and ZigBee?",["IEEE 802.15.4 provides layers 1 and 2, while ZigBee extends the functionality to layer 3 and above.","ZigBee provides only the physical layer, while IEEE 802.15.4 provides all higher layers.","Both standards operate only at the application layer.","ZigBee and IEEE 802.15.4 are identical standards with no functional distinction."],"a","802.15.4 specifies the physical and MAC layers. ZigBee sits on top and adds authentication, encryption, routing and mesh support."],
["Which of the following statements characterizes a ZigBee end device?",["It communicates with its parent node.","It cannot relay data for other devices.","It is a reduced-functionality device.","It forms the network root and acts as the trust center."],"abc","An end device talks to its parent but cannot relay data. The coordinator forms the root and may act as trust center."],
["Which option correctly describes addressing in 6LoWPAN?",["A 16-bit address is globally unique, while a 64-bit address is PAN-specific.","A 16-bit short address is PAN-specific and assigned by the PAN coordinator, while a 64-bit extended address is globally unique.","Both 16-bit and 64-bit addresses are globally unique and assigned by an Internet router.","Both address types are used only for multicast communication."],"b","16-bit short addresses are PAN-specific and assigned by the PAN coordinator; 64-bit extended addresses are globally unique."],
["State True or False. In LOADng routing, an intermediate router may respond to a Route Request (RREQ) whenever it already has an active route to the requested destination.",["True","False"],"b","In LOADng only the destination may respond to an RREQ; intermediate routers are prohibited from responding."],
["How does a passive RFID tag obtain the power required to transmit information?",["It uses its own internal battery.","It is powered inductively by an RFID reader.","It receives power through a wired AIDC connection.","It does not require any source of power."],"b","Passive tags have no power supply; they are powered inductively by a reader. Active tags have their own supply."]
],

3:[
["Which WirelessHART data-link mechanism provides reliable, collision-free, and deterministic communication?",["Superframes divided into 10-millisecond TDMA time slots","Pure ALOHA without time-slot allocation","CSMA/CD over a wired Ethernet bus","Token-ring circulation among field devices"],"a","WirelessHART uses TDMA (Time Division Multiple Access). Time is divided into fixed slots assigned to devices, preventing simultaneous transmissions and providing predictable, reliable communication."],

["In WirelessHART, which entity supervises network nodes and guides them regarding when and where packets should be transmitted?",["Network manager","NFC reader","Z-Wave end device","Bluetooth inquiry agent"],"a","The WirelessHART Network Manager manages the network, determines communication paths, and schedules when devices transmit data."],

["Which of the following are operating modes of NFC?",["Peer-to-peer mode","Read/write mode","Card-emulation mode","Frequency-hopping mode"],"abc","NFC supports three main modes: peer-to-peer for exchanging information between devices, read/write for interacting with tags, and card emulation for acting like a contactless smart card."],

["Which of the following are phases of Bluetooth connection establishment?",["Inquiry or discovery phase","Paging phase","Connection phase","Channel-blacklisting phase"],"abc","Bluetooth devices discover nearby devices during inquiry, establish contact through paging, and then enter the connection phase. Channel blacklisting is not a connection-establishment phase."],

["A single Z-Wave network can contain up to approximately how many nodes?",["32","64","128","232"],"d","According to the provided course question, a single Z-Wave network can contain up to approximately 232 nodes."],

["Which of the following statements about Z-Wave addressing are correct?",["Each logical Z-Wave network has one Home ID.","A Z-Wave Node ID has a length of one byte.","A Z-Wave Home ID has a length of four bytes.","Nodes having different Home IDs can communicate directly with one another."],"abc","A Z-Wave network is identified by a 4-byte Home ID, while individual nodes use 1-byte Node IDs. Different Home IDs identify different logical networks."],

["Which of the following statements about ISA100.11a are correct?",["Its network and transport layers are based on TCP, UDP, or IPv6.","Its data-link layer supports mesh networking with frequency hopping.","Its radio is based on IEEE 802.15.4.","It supports only a ring topology."],"abc","ISA100.11a is an industrial wireless networking standard. It uses IEEE 802.15.4-based radio, supports mesh networking with frequency hopping, and supports IP-related networking technologies. It is not restricted to ring topology."],

["Why is multi-hop communication commonly used in a wireless sensor network?",["Sensor nodes have short transmission ranges, so intermediate nodes relay data toward the sink.","Every sensor node must communicate directly with the Internet.","Multi-hop communication eliminates the need for a sink node.","Only mobile sensor nodes are permitted to transmit data."],"a","Sensor nodes have limited transmission power and range. Intermediate nodes relay packets from one node to another until the data reaches the sink."],

["Which of the following is described as an optional unit of a sensor node?",["Sensing unit","Processing unit","Power unit","Location-finding system such as GPS"],"d","The sensing, processing, and power units are essential components of a typical sensor node. A location-finding system such as GPS is optional."],

["If n denotes the number of nodes in a sensor network, the lecture states that the throughput decreases approximately at what rate as the network scales?",["1/n","n","sqrt(n)","1/sqrt(n)"],"d","According to the lecture referenced by the question, throughput decreases approximately as 1/sqrt(n), where n is the number of nodes. More nodes must share the wireless medium."],

["Which types of sensor-node misbehavior are classified as intentional?",["Malicious behavior","Selfish behavior","Failed-node behavior","Badly failed-node behavior"],"ab","Malicious nodes deliberately attack or disrupt the network, while selfish nodes refuse to cooperate to conserve resources. Ordinary node failures are generally associated with malfunction."],

["What distinguishes a badly failed sensor node from an ordinarily failed sensor node?",["It additionally sends false routing messages.","It always increases the network throughput.","It changes from a mobile node into a stationary node.","It communicates normally but consumes no power."],"a","An ordinarily failed node may stop functioning correctly. A badly failed node may continue participating while sending false routing messages, misleading other nodes and disrupting communication."],

["Which consequence may arise when a selfish sensor node refuses to cooperate because forwarding involves a personal cost?",["It forwards every received packet twice.","It drops a received packet instead of forwarding it.","It automatically becomes the sink node.","It increases the communication range of neighboring nodes."],"b","A selfish node may drop other nodes' packets to conserve battery power and other resources, reducing cooperation and network performance."]
],

["How can standard nanodevices communicate?",["Electromagnetic communication","Molecular communication","Wired Ethernet","ZigBee communication"],"ab","The lecture discusses electromagnetic and molecular communication for nanodevices."],
["When does sensing coverage guarantee network connectivity?",["When the transmission range is at least twice the sensing range","When the sensing range is at least twice the transmission range","When the transmission and sensing ranges are equal","When the transmission range is smaller than the sensing range"],"a","Coverage guarantees connectivity when the transmission range is at least twice the sensing range."],

["Which reporting method is used for forest-fire monitoring in a WSN?",["Event-driven reporting","On-demand reporting","Manual reporting","Location-based reporting"],"a","Nodes report when a fire-related event is detected. On-demand reporting suits something like an inventory-control system."],
["What does a data mule do?",["Replaces all sensor nodes","Measures only temperature","Collects data and carries it to the sink","Repairs damaged hardware"],"c","A data mule visits sensor nodes, collects their data and delivers it to the sink."],

["A person who provides sensing information acts as a:",["Router","Radio channel","Actuator","Data source"],"d","In human-centric sensing a person can be a data source."],

["State True or False. In a UAV network, the network topology may change frequently because the UAVs are mobile.",["True","False"],"a","UAV movement changes relative positions and links, so topology changes frequently."],
["Which is a common issue in UAV networks?",["Frequent topology changes","Fixed relative positions","Permanent communication links","No possibility of UAV failure"],"a","UAV movement causes frequent topology and link changes."],

["State True or False. In a stationary wireless sensor network, sensor nodes can automatically move to restore connectivity after a node failure.",["True","False"],"b","Stationary nodes remain fixed, so they cannot move to repair connectivity."],

],"a","Answer key should be verified against the highlighted answer in the original PDF."],["AmbuSense is a privacy-aware system",["True","False"],"a","Answer key should be verified against the highlighted answer in the original PDF."],["The two most relevant sensors directly used in agriculture are __________.",["Soil moisture and ECG sensor","Soil moisture and water level sensor","ECG sensor and water level sensor","All of these"],"a","Answer key should be verified against the highlighted answer in the original PDF."],["Examples of dispersion measures include _______ and ______.",["Discrete, categorical","Continuous, quantitative","Discrete, quantitative","Range, Variance"],"a","Answer key should be verified against the highlighted answer in the original PDF."],["Suppose that your smartphone tilts by an angle of 15 degrees. Which among the following sensors will detect this tilt?",["HC-SR04","Gyroscope","Accelerometer","Monometer"],"a","Answer key should be verified against the highlighted answer in the original PDF."]],"pyq-jul-2025":[["Which of the following is/are not a thing as per IoT?",["Fan","Light","Refrigerator","None of the these"],"b","All listed items (fan, light, refrigerator) can be IoT-enabled when connected and controlled via the internet. Hence, none of them are excluded from being considered an IoT \"thing.\""],["State true or false. Statement: The things in IoT consist of embedded systems.",["True","False"],"a","Answer key should be verified against the highlighted answer in the original PDF."],["State whether the following statement is True or False. Statement: IoT is one of the technologies that enable smart farms.",["True","False"],"a","Answer key should be verified against the highlighted answer in the original PDF."],["State whether the following statement is True or False. © Exam Buddy → NPTEL- JULY 2025 Course Notes Gmail – nptelsolver@gmail.com Statement: In M2M, it is mandatory that the interactions between the machines and devices happen through a cloud computing infrastructure.",["True","False"],"a","In M2M (Machine-to-Machine), devices can communicate directly without needing cloud infrastructure. Cloud may be used for advanced processing, but it is not mandatory."],["Sometimes, when there is a need for the nodes to communicate directly to the Internet, ………………………….. can be used.",["Sensors","Actuators","Tunneling","None of these"],"a","Answer key should be verified against the highlighted answer in the original PDF."],["State whether the following statement is true or false. Statement: In multi-homing a node/network is connected to only two networks for improved reliability.",["True","False"],"a","Multi-homing refers to a node or network being connected to two or more networks, not just two, to improve reliability and redundancy. It ensures continuous connectivity even if one network fails. Limiting it to only two networks is not a requirement."],["Which of the following is/are not enablers of IoT?",["Advancement in gene sequencing","Nanotechnology","Sensors","RFID"],"a","Answer key should be verified against the highlighted answer in the original PDF."],["State whether the following statement is True or False. Statement: The decreasing number of devices in IoT is expected to result in an address crunch.",["True","False"],"a","Answer key should be verified against the highlighted answer in the original PDF."],["Why IoT has become so popular?",["It can provide advanced level of services to the society","It can help reduce human effort","It can potentially make processes more efficient","All of these"],"b","IoT is popular because it enhances services, reduces human effort, and improves efficiency in various processes. Its wide applicability in smart homes, healthcare, and"],["State whether the following statement is true or false. The resolution of a sensor is the maximum change it can detect in the quantity that it is measuring.",["False","True"],"a","The resolution of a sensor is the minimum change it can detect, not the maximum. Maximum change refers to the range of the sensor, while resolution measures sensitivity to small variations."],["Transducer is a …………term and includes………",["special, only sensors","special, only actuators","collective, both sensors and actuators","None of these"],"a","Answer key should be verified against the highlighted answer in the original PDF."],["Which of the following is/are feature/features of sensors?",["It is only sensitive to the measured property.","It acts on the surrounding environment. с. Both (a) and (b)","None of these","None of these"],"a","Answer key should be verified against the highlighted answer in the original PDF."],["Which of the following technologies have unified and has resulted in the evolution of IoT?",["Low-power embedded systems","Cloud Computing","Machine Learning","All of these"],"a","Answer key should be verified against the highlighted answer in the original PDF."],["What is the full form of IoT?",["Internet of Tasks","Internet of Things","Internet of Tracks","None of these"],"b","IoT stands for Internet of Things, referring to a network of physical devices that connect and exchange data over the internet."],["A sensor node is not made up of which of the following?",["Sensor/Sensors","A processing unit","A power unit","None of these"],"a","Answer key should be verified against the highlighted answer in the original PDF."],["The full form of MQTT is",["Message Queue Telephone Transmission","Message Query Telemetry Transport","Message Queue Telemedicine Transport","None of these"],"b","The correct full form of MQTT is Message Queuing Telemetry Transport, not any of the options listed. It is a lightweight messaging protocol used in IoT for reliable communication."],["Which of the following is NOT a method in MQTT?",["Break","Stick","Run","All of these"],"a","MQTT uses methods like CONNECT, PUBLISH, SUBSCRIBE, and DISCONNECT, but Break, Stick, and Run are not valid MQTT methods. Hence, all the options listed are incorrect."],["Which of the following is/are component/components of MQTT?",["Publishers","Subscribers","Brokers","All of these"],"a","Answer key should be verified against the highlighted answer in the original PDF."],["State whether the following statement is true or false. SMQTT is an extension of MQTT which uses lightweight attribute based encryption. It has three main stages.",["True","False"],"b","SMQTT is not a widely standardized extension of MQTT with three main stages; the statement about lightweight attribute-based encryption and three stages is incorrect. MQTT security is generally handled via TLS or other mechanisms."],["The OSI model has …………… layers.",["6","8","Both (a) and (b)","None of these"],"a","Answer key should be verified against the highlighted answer in the original PDF."],["The two sub-layers of CoAP are -",["Messaging and Holding","Messaging and Backoff","Messaging and Teardown","None of these"],"a","The two sub-layers of CoAP (Constrained Application Protocol) are Messaging and Request/Response. None of the options listed match the correct sub-layers."],["What is the full form of AMQP in the context of IoT protocol?",["Another Message Queuing Protocol","Anchored Message Queuing Protocol","Adjoint Message Queuing Protocol","None of these"],"a","The correct full form of AMQP is Advanced Message Queuing Protocol, a messaging protocol used for reliable communication in IoT and other distributed systems."],["XMPP uses the …………. architecture.",["Publish-subscribe","Client-server","Both (a) and (b)","Neither (a) nor (b)"],"a","XMPP primarily uses a client-server architecture, where clients communicate through servers to exchange messages and presence information. The publish-subscribe model"],["How many message delivery guarantee modes are there in the AMQP protocol?",["2","3","4","None of these"],"a","Answer key should be verified against the highlighted answer in the original PDF."],["Which of the following is/are NOT an AMQP frame type?",["Open","Close","Random","None of these"],"a","AMQP frame types include Open, Close, Begin, End, and Transfer, but Random is not a valid AMQP frame type."],["State whether the following statement is true or false. Statement: IEEE 802.15.5 was developed for low data rate monitoring and control applications and extended life low power communication uses.",["True","False"],"a","Answer key should be verified against the highlighted answer in the original PDF."],["Which of the following is/are exchange types in AMQP?",["Direct","Indirect","Both (a) and (b)","None of these"],"a","AMQP defines exchange types like Direct, Fan-out, Topic, and Header, which control how messages are routed. Indirect is not a valid AMQP exchange type."],["State whether the following statement is True or False. Statement: The IEEE 802.15.4 operates in ISM band.",["True","False"],"a","Answer key should be verified against the highlighted answer in the original PDF."],["The networking topologies supported in the IEEE 802.15.4 are -",["Only Star","Star and Mesh","Only Mesh","None of these"],"a","Answer key should be verified against the highlighted answer in the original PDF."],["State whether the following statement is True or False. Statement: Generation of Route Requests (RREQs) by a LOADng Router for discovering a route to a destination is a valid operation of the LOADng routing protocol.",["False","True"],"a","Answer key should be verified against the highlighted answer in the original PDF."],["HART operates only in …… GHz ISM band.",["2.3","4.8","Both (a) and (b)","None of these"],"a","The Highway Addressable Remote Transducer (HART) protocol is not an RF standard but primarily a communication protocol that uses the Bell 202 FSK standard over 4-20 mA analog wiring. For its WirelessHART variant, it operates in the 2.4 GHz ISM band, not"],["State whether the following statement is true or false. Statement: The HART physical layer is derived from IEEE 802.15.4 protocol and operates only in 2.5 GHz ISM band.",["False","True"],"a","While WirelessHART uses the IEEE 802.15.4 physical layer, it operates specifically in the"],["State whether the following statement is True or False Statement: Each node is supervised by the application manager and it guides them on when and where to send packets.",["True","False"],"b","The statement is false because it incorrectly names the \"application manager.\" In WirelessHART, it is the central Network Manager, not an application manager, that supervises nodes and provides the communication schedules dictating when and where"],["………………. identifies channels consistently affected by interference and removes them from use.",["Channel hopping","Channel aggregating","Channel blacklisting","Frequency aggregating"],"a","Answer key should be verified against the highlighted answer in the original PDF."],["State whether the following statement is true or false. Statement: The Network Manager supervises each node in the network and guides them on when and where to send packets.",["True","False"],"a","Answer key should be verified against the highlighted answer in the original PDF."],["Which layer of HART incorporates channel hopping and channel blacklisting?",["Surface Layer","Troposphere","Data Link Layer","None of these"],"a","Answer key should be verified against the highlighted answer in the original PDF."],["Wireless HART relies on ……….. for its communication.",["Star networking","Bus networking с. Both (a) and (b)","None of these","None of these"],"a","WirelessHART does not use a simple star or bus topology. It uses a mesh network topology, where each device can act as a router for others, providing multiple paths for data to ensure high reliability and network coverage."],["State whether the following statement is true or false. NFC devices work on the principle of magnetic introduction.",["True","False"],"a","NFC (Near Field Communication) devices work on the principle of electromagnetic induction, not magnetic induction. While both principles involve magnetic fields, electromagnetic induction specifically refers to the generation of an electromotive force by a changing magnetic field, which is the core operating principle for NFC."],["Bluetooth technology is based on Ad-hoc technology also known as ……………",["Ad-hoc meshnet","Ad-hoc Piconets","Ad-hoc starnet","None of these"],"a","Answer key should be verified against the highlighted answer in the original PDF."],["State whether the following statement is true or false Statement: Booking in Bluetooth is the process of forming a connection between two Bluetooth devices.",["True","False"],"a","The process of forming a connection between two Bluetooth devices is called pairing or bonding, not \"booking.\" The term \"booking\" is not used in Bluetooth technology to describe this fundamental connection setup process."],["State whether the following statement is true or false. Statement: Class 1 Bluetooth radios are used primarily in industrial use cases and have a range of 100 meters or 300 feet.",["True","False"],"a","Answer key should be verified against the highlighted answer in the original PDF."],["Zwave uses ……………. topology.",["Ring","Star","Mesh","None of these"],"c","Z-Wave uses a mesh network topology, where each device (node) can communicate with others to relay data. This extends the network's range and reliability beyond a direct connection to the controller."],["Which of the following is an OS for sensor nodes?",["MicroOS","LiteOS","TinyOS","None of these"],"a","Answer key should be verified against the highlighted answer in the original PDF."],["State whether the following statement is true or false. Statement: Selfish nodes are typified by their unwillingness to cooperate, as the protocol requires whenever there is a personal cost involved.",["True","False"],"a","Answer key should be verified against the highlighted answer in the original PDF."],["Dumb behavior of sensor nodes is ………………… in nature (as it is dependent on the effects of the environmental conditions).",["Temporal","Spatial с. Both (a) and (b)","None of these","None of these"],"a","Dumb behavior refers to temporary malfunctions caused by transient environmental factors like noise or interference. Since these conditions vary over time, the resulting behavior is temporal, not permanent or based on location (spatial)."],["If transmission range > 2* sensing range,",["Coverage implies connectivity","Coverage implies greater coverage","Both (a) and (b)","None of these"],"a","The condition where transmission range is greater than twice the sensing range ensures that connectivity implies coverage, not the other way around. This means if all nodes are connected, the area is also covered, but coverage alone does not automatically guarantee connectivity under all network deployments."],["What is the full form of AUV in the context of mobile wireless sensor networks?",["Aerial and Underwater Vehicle","Ambient and Underprivileged Vehicle","Astronomical Underwater Vehicle","None of these"],"a","In mobile wireless sensor networks, AUV stands for Autonomous Underwater Vehicle."],["State whether the following statement is true or false. Statement: Agricultural intrusion detection uses NFC sensors.",["True","False"],"a","Agricultural intrusion detection typically uses sensors like seismic, acoustic, or motion detectors over larger outdoor areas. NFC is for extremely short-range communication (a few centimeters) and is not practical for monitoring large agricultural fields for intrusion."],["The objective of coverage in WSN is to use a………………….number of sensors and………the network lifetime.",["minimum, minimize","maximum, minimize,","maximum, maximize","None of these"],"a","Answer key should be verified against the highlighted answer in the original PDF."],["WSN in agriculture uses what for processing?",["Microprocessor","Microcontroller","Both (a) and (b)","None of these"],"a","Answer key should be verified against the highlighted answer in the original PDF."],["Which of the following is/are options for communication among nanodevices?",["Electromagnetic","Molecular","Both (a) and (b)","None of these"],"a","Answer key should be verified against the highlighted answer in the original PDF."],["State whether the following statement is true or false. Statement: Voluntary Sensing allows distributed sensing carried by humans and the goal is not just to collect data but to allow the common people to assess and share the knowledge.",["False","True"],"b","The described concept is known as Participatory Sensing, not \"Voluntary Sensing.\" While the core idea of distributed data collection by people for public knowledge sharing is correct, the specific term used in the statement is inaccurate."],["State whether the following statement is true or false. Statement: UAV networks use a ring topology.",["True","False"],"a","Answer key should be verified against the highlighted answer in the original PDF."],["In multi-UAV networks, the scalability is",["Low","Very Low","Poor","None of these"],"a","Answer key should be verified against the highlighted answer in the original PDF."],["Single UAV system uses ………… antenna.",["Uni-directional","Omni-directional","Both (a) and (b)","None of these"],"b","A single UAV system typically uses an omni-directional antenna to maintain communication with the ground control station regardless of its orientation, ensuring constant connectivity without needing precise antenna alignment."],["Which of the following is/are constraint/constraints of UAV network?",["Infrequent link breakages","Malfunction","Both (a) and (b)","None of these"],"a","While link breakages can occur, \"infrequent link breakages\" is not a primary, defining constraint; it is more of a potential characteristic or challenge. Malfunction of UAVs due to hardware failure, software errors, or external factors is a fundamental and critical constraint in UAV network design and operation."],["Low-end sensor nodes are", ainst the highlighted answer in the original PDF."],["Which of the following are inbuilt sensors present in high-end smartphones (as discussed)?",["ECG and EEG","Accelerometer, proximity sensor, and EEG","Accelerometer, Compass, and Gyroscope","Pressure sensor and NPK sensor"],"a","Answer key should be verified against the highlighted answer in the original PDF."],["Fill in the blank. Processing the handheld activity device data using artificial intelligence can be used for…",["Fall detection","Heart rate detection","Vehicle detection","All of these"],"a","Answer key should be verified against the highlighted answer in the original PDF."],["State True or False. Continuous monitoring of a person's activity can help observe behavior and identify repetitive patterns.",["True","False"],"a","Answer key should be verified against the highlighted answer in the original PDF."]]};

var ALL = [];
Object.keys(BANK).forEach(function(w){
  BANK[w].forEach(function(r,i){
    ALL.push({id:w+"-"+(i+1), w:+w, n:i+1, q:r[0], o:r[1], a:r[2], e:r[3]});
  });
});

var app = document.getElementById("app");
var S = null;
var cfg = {mode:"assignment", scope:"all", shuffle:false, source:"weekly"};
var LET = "abcd";
var NW = Object.keys(BANK).length;

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function shuffle(a){
  a = a.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function pool(c){
  if(c.source && c.source !== "weekly"){
    var rows = PYQ_BANKS[c.source] || [];
    return rows.map(function(r,i){ return {id:c.source+"-"+(i+1), w:0, n:i+1, q:r[0], o:r[1], a:r[2], e:r[3]}; });
  }
  return c.scope==="all" ? ALL : ALL.filter(function(x){ return x.w===+c.scope; });
}
function modeName(m){ return m==="quiz" ? "Quiz" : "Assignment"; }

function renderHome(){
  S = null;
  var n = pool(cfg).length;
  var sourceButtons = [
    ['weekly','Weekly practice'],
    ['pyq-jan-2025','PYQ January 2025'],
    ['pyq-jul-2025','PYQ July 2025'],
    ['pyq-jan-2026','PYQ January 2026']
  ].map(function(x){ return '<button class="chip" data-source="'+x[0]+'" aria-pressed="'+(cfg.source===x[0])+'">'+x[1]+'</button>'; });
  var scopes = ['<button class="chip" data-scope="all" aria-pressed="'+(cfg.scope==="all")+'">All weeks</button>'];
  for(var w=1; w<=NW; w++) scopes.push('<button class="chip" data-scope="'+w+'" aria-pressed="'+(String(cfg.scope)===String(w))+'">Week '+w+'</button>');
  app.innerHTML =
    '<h1>IoT Quiz</h1>' +
    '<h2>Question source</h2><div class="row">'+sourceButtons.join("")+'</div>' +
    (cfg.source==="weekly" ? '<h2>Questions from</h2><div class="row">'+scopes.join("")+'</div>' : '<p class="desc">Practice questions from the selected uploaded PYQ PDF.</p>') +
    '<h2>Order</h2><div class="row">' +
      '<button class="chip" data-shuffle="0" aria-pressed="'+(!cfg.shuffle)+'">In order</button>' +
      '<button class="chip" data-shuffle="1" aria-pressed="'+cfg.shuffle+'">Shuffled</button></div>' +
    '<button class="primary" id="start">Start &middot; '+n+' questions</button>';
}

function begin(c, list, label, retry){
  S = {cfg:{mode:c.mode, scope:c.scope, shuffle:c.shuffle}, mode:c.mode, retry:!!retry, list:list, label:label, i:0, sel:[], revealed:false, results:[]};
  renderQuestion();
}
function startFromCfg(c){
  var list = pool(c).slice();
  if(c.shuffle) list = shuffle(list);
  var label = c.source && c.source!=="weekly"
    ? ({ "pyq-jan-2025":"PYQ January 2025", "pyq-jul-2025":"PYQ July 2025", "pyq-jan-2026":"PYQ January 2026" }[c.source])
    : (c.scope==="all" ? "All weeks" : "Week "+c.scope);
  begin(c, list, label);
}

function isCorrect(item, sel){ return sel.slice().sort().join("") === item.a; }

function renderQuestion(){
  var it = S.list[S.i], multi = it.a.length > 1, total = S.list.length, fbMode = S.mode === "assignment";
  var pct = Math.round((S.i + (S.revealed?1:0)) / total * 100);
  var opts = it.o.map(function(t,k){
    var L = LET[k], cls = "opt", pressed = S.sel.indexOf(L) > -1;
    if(S.revealed){
      var right = it.a.indexOf(L) > -1;
      if(right && pressed) cls += " ok"; else if(right) cls += " missed"; else if(pressed) cls += " bad";
    }
    return '<button class="'+cls+'" data-k="'+L+'" aria-pressed="'+pressed+'"'+(S.revealed?' disabled':'')+'><span class="k">'+L.toUpperCase()+'</span><span class="t">'+esc(t)+'</span></button>';
  }).join("");
  var fb = "", action;
  if(S.revealed){
    var ok = isCorrect(it, S.sel);
    var ans = it.a.split("").map(function(l){ return l.toUpperCase(); }).join(", ");
    fb = '<p class="fb '+(ok?'ok':'bad')+'"><b>'+(ok?'Correct':'Wrong. Answer: '+ans)+'</b>'+(it.e?'<span>'+esc(it.e)+'</span>':'')+'</p>';
    action = '<button class="primary inline" id="next">'+(S.i+1<total?'Next':'Results')+'</button>';
  } else if(fbMode){
    action = '<button class="primary inline" id="check"'+(S.sel.length?'':' disabled')+'>Check</button>';
  } else {
    action = '<button class="primary inline" id="check"'+(S.sel.length?'':' disabled')+'>'+(S.i+1<total?'Next':'Finish')+'</button>';
  }
  app.innerHTML =
    '<div class="top"><button id="quit">&larr; Exit</button><span>'+esc(S.label)+' &middot; '+(S.i+1)+'/'+total+'</span></div>' +
    '<div class="track"><div class="fill" style="width:'+pct+'%"></div></div>' +
    '<p class="qtext">'+esc(it.q)+'</p>' + (multi?'<p class="sub">Select all that apply</p>':'') +
    '<div class="opts">'+opts+'</div>' + fb + action;
}

function pick(L){
  if(!S || S.revealed) return;
  var it = S.list[S.i];
  if(it.a.length > 1){
    var p = S.sel.indexOf(L);
    if(p > -1) S.sel.splice(p,1); else S.sel.push(L);
  } else { S.sel = [L]; }
  renderQuestion();
}
function check(){
  if(!S || S.revealed || !S.sel.length) return;
  var it = S.list[S.i];
  S.results.push({item:it, sel:S.sel.slice(), ok:isCorrect(it, S.sel)});
  if(S.mode === "assignment"){ S.revealed = true; renderQuestion(); }
  else advance();
}
function advance(){
  if(S.i + 1 < S.list.length){ S.i++; S.sel = []; S.revealed = false; renderQuestion(); }
  else renderResults();
}
function next(){ if(S && S.revealed) advance(); }

function renderResults(){
  var score = S.results.filter(function(r){ return r.ok; }).length, total = S.results.length;
  var missed = S.results.filter(function(r){ return !r.ok; });
  var list = missed.map(function(r){
    var it = r.item;
    var right = it.a.split("").map(function(l){ return l.toUpperCase()+". "+it.o[LET.indexOf(l)]; }).join(" | ");
    var yours = r.sel.map(function(l){ return l.toUpperCase()+". "+it.o[LET.indexOf(l)]; }).join(" | ");
    return '<div class="miss"><p class="q">'+esc(it.q)+'</p><p class="a">You chose: '+esc(yours)+'</p><p class="a">Answer: <b>'+esc(right)+'</b></p>'+(it.e?'<p class="a">'+esc(it.e)+'</p>':'')+'</div>';
  }).join("");
  app.innerHTML =
    '<div class="top"><button id="quit">&larr; Home</button><span>'+esc(S.label)+'</span></div>' +
    '<div class="score">'+score+' / '+total+'</div>' +
    '<div class="row">' +
      (missed.length ? '<button class="primary inline" id="retryMissed">Retry missed ('+missed.length+')</button>' : '') +
      '<button id="again">'+(S.retry?'Home':'Restart')+'</button></div>' +
    (missed.length ? '<h2>Missed</h2>'+list : '');
}

app.addEventListener("click", function(e){
  var t = e.target.closest("button"); if(!t) return;
  if(t.dataset.scope){ cfg.scope = t.dataset.scope; return renderHome(); }
  if(t.dataset.source){ cfg.source = t.dataset.source; return renderHome(); }
  if(t.dataset.shuffle){ cfg.shuffle = t.dataset.shuffle === "1"; return renderHome(); }
  if(t.id === "start") return startFromCfg(cfg);
  if(t.dataset.k) return pick(t.dataset.k);
  if(t.id === "check") return check();
  if(t.id === "next") return next();
  if(t.id === "quit") return renderHome();
  if(t.id === "retryMissed"){
    var m = S.results.filter(function(r){ return !r.ok; }).map(function(r){ return r.item; });
    return begin(S.cfg, shuffle(m), "Retry", true);
  }
  if(t.id === "again"){ return S.retry ? renderHome() : startFromCfg(S.cfg); }
});
document.addEventListener("keydown", function(e){
  if(!S || e.metaKey || e.ctrlKey || e.altKey || !document.querySelector(".opts")) return;
  var k = e.key.toLowerCase();
  if(!S.revealed && k.length === 1 && "abcd".indexOf(k) > -1){
    if(LET.indexOf(k) < S.list[S.i].o.length) pick(k);
  } else if(e.key === "Enter"){
    e.preventDefault();
    if(S.revealed) next(); else check();
  }
});
renderHome();
</script>
